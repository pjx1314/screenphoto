name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: checks
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/package.sh dist "${{ matrix.target }}"

      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1 -Out dist -Target "${{ matrix.target }}"

      - name: Name Linux assets
        if: runner.os == 'Linux'
        shell: bash
        run: cp dist/screenphoto-*-x86_64-unknown-linux-musl.zip dist/screenphoto-linux-x86_64.zip

      - name: Name Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $versioned = Get-ChildItem "dist/screenphoto-*-x86_64-pc-windows-msvc.zip" | Select-Object -First 1
          Copy-Item $versioned.FullName "dist/screenphoto-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: screenphoto-${{ matrix.target }}
          if-no-files-found: error
          path: dist/screenphoto-*-x86_64.zip

  crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source archive
        run: cargo package --locked

      - name: Collect archive
        run: |
          mkdir -p dist
          cp target/package/screenphoto-*.crate dist/

      - uses: actions/upload-artifact@v4
        with:
          name: screenphoto-crate
          if-no-files-found: error
          path: dist/*.crate

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - checks
      - build
      - crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Check tag version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Write checksums
        working-directory: assets
        run: sha256sum *.zip *.crate > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" assets/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
